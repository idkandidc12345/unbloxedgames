<!DOCTYPE html>
<html lang="en">
<head>
<link rel="icon" type="image/png" href="https://freepngimg.com/download/meme/98777-meme-dank-free-download-png-hq.png">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Unbloxed Games</title>
    <style>
        /* Base Reset & Background */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background: #000000; /* Pure Black Background */
            color: #fff;
            min-height: 100vh;
            padding: 2rem;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* Apple Glassmorphism Styling with Dark/Yellow Accents */
        .glass-panel {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.8);
        }

        /* Header & Search Bar */
        header {
            width: 100%;
            max-width: 1200px;
            text-align: center;
            margin-bottom: 3rem;
        }

        h1 {
            font-size: 3rem;
            font-weight: 800;
            margin-bottom: 1.5rem;
            letter-spacing: -0.5px;
            background: linear-gradient(180deg, #ffffff 0%, #facc15 100%); /* White to Yellow Gradient */
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .search-container {
            max-width: 500px;
            margin: 0 auto;
            position: relative;
        }

        .search-bar {
            width: 100%;
            padding: 14px 24px;
            font-size: 1rem;
            color: #fff;
            outline: none;
            border: 1px solid rgba(250, 204, 21, 0.3); /* Soft Yellow Border */
            transition: all 0.3s ease;
        }

        .search-bar::placeholder {
            color: rgba(255, 255, 255, 0.4);
        }

        .search-bar:focus {
            background: rgba(250, 204, 21, 0.05);
            border-color: #facc15; /* Bright Yellow Focus */
            box-shadow: 0 0 15px rgba(250, 204, 21, 0.2);
        }

        /* Games Grid */
        .games-grid {
            width: 100%;
            max-width: 1200px;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 2rem;
            padding: 10px;
        }

        /* Game Card */
        .game-card {
            cursor: pointer;
            overflow: hidden;
            transition: transform 0.3s cubic-bezier(0.25, 1, 0.5, 1), box-shadow 0.3s ease, border-color 0.3s ease;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 1.5rem;
            text-align: center;
        }

        .game-card:hover {
            transform: translateY(-8px);
            background: rgba(255, 255, 255, 0.07);
            border-color: #facc15; /* Bright Yellow Border on Hover */
            box-shadow: 0 12px 40px 0 rgba(250, 204, 21, 0.15);
        }

        .game-thumbnail {
            width: 120px;
            height: 120px;
            object-fit: contain;
            border-radius: 18px;
            margin-bottom: 1.2rem;
            background: rgba(255, 255, 255, 0.05);
            padding: 10px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .game-title {
            font-size: 1.2rem;
            font-weight: 600;
            color: #ffffff;
            transition: color 0.2s ease;
        }

        .game-card:hover .game-title {
            color: #facc15; /* Title switches to yellow on hover */
        }

        /* No Results Message */
        .no-results {
            display: none;
            font-size: 1.2rem;
            color: rgba(255, 255, 255, 0.5);
            margin-top: 3rem;
        }

        /* Modal Overlay */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.9); /* Matte Black Backdrop */
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        /* Main Game Containment Box */
        .modal-content {
            width: 100%;
            max-width: 1000px;
            height: 85vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            border: 1px solid rgba(250, 204, 21, 0.3); /* Subtle yellow frame tint */
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.9);
        }

        /* Control Bar */
        .control-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 24px;
            background: rgba(0, 0, 0, 0.6);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .control-btn {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: #fff;
            padding: 8px 16px;
            border-radius: 12px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.9rem;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: all 0.2s ease;
        }

        .control-btn:hover {
            background: #ffffff;
            color: #000000; /* Crisp color inversion */
            border-color: #ffffff;
            box-shadow: 0 4px 12px rgba(255, 255, 255, 0.2);
        }

        .control-btn.close-style {
            background: rgba(250, 204, 21, 0.1);
            border-color: rgba(250, 204, 21, 0.3);
            color: #facc15;
        }

        .control-btn.close-style:hover {
            background: #facc15;
            color: #000000;
            border-color: #facc15;
            box-shadow: 0 4px 12px rgba(250, 204, 21, 0.3);
        }

        /* Wrapper to keep iframe scaling nicely */
        .iframe-container {
            flex-grow: 1;
            width: 100%;
            height: 100%;
            background: #000;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>

    <div id="noResults" class="no-results">No games found matching your search.</div>

    <div class="modal" id="gameModal">
        <div class="modal-content glass-panel">
             
            <div class="control-bar">
                <button class="control-btn close-style" onclick="closeGame()">
                    ← Back to Menu
                </button>
                <button class="control-btn" onclick="toggleFullScreen()">
                    ⛶ Full Screen
                </button>
            </div>

            <div class="iframe-container" id="iframeContainer">
                <iframe id="gameFrame" src="" allowfullscreen></iframe>
            </div>

        </div>
    </div>

    <script>
        // Open game modal
        function openGame(url) {
            const modal = document.getElementById('gameModal');
            const frame = document.getElementById('gameFrame');
            frame.src = url;
            modal.style.display = 'flex';
        }

        // Close game window (Back to Home Menu)
        function closeGame() {
            const modal = document.getElementById('gameModal');
            const frame = document.getElementById('gameFrame');
            
            // Exit fullscreen if active when leaving game
            if (document.fullscreenElement) {
                document.exitFullscreen();
            }

            frame.src = ''; // Kill frame processes / sound
            modal.style.display = 'none';
        }

        // Native Browser Fullscreen Controller
        function toggleFullScreen() {
            const container = document.getElementById('iframeContainer');
            
            if (!document.fullscreenElement) {
                if (container.requestFullscreen) {
                    container.requestFullscreen();
                } else if (container.webkitRequestFullscreen) { /* Safari */
                    container.webkitRequestFullscreen();
                } else if (container.msRequestFullscreen) { /* IE11 */
                    container.msRequestFullscreen();
                }
            } else {
                if (document.exitFullscreen) {
                    document.exitFullscreen();
                }
            }
        }

        // Real-time search filter function
        function searchGames() {
            const input = document.getElementById('searchBar').value.toLowerCase();
            const cards = document.getElementsByClassName('game-card');
            const noResults = document.getElementById('noResults');
            let visibleCardsCount = 0;

            for (let i = 0; i < cards.length; i++) {
                const title = cards[i].getAttribute('data-title');
                if (title.includes(input)) {
                    cards[i].style.display = 'flex';
                    visibleCardsCount++;
                } else {
                    cards[i].style.display = 'none';
                }
            }

            if (visibleCardsCount === 0) {
                noResults.style.display = 'block';
            } else {
                noResults.style.display = 'none';
            }
        }
    </script>
