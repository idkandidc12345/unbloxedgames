<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Unbloxed Games</title>
    <style>
        /* Base Reset & Background */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #0f172a, #1e1b4b, #311042);
            color: #fff;
            min-height: 100vh;
            padding: 2rem;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* Apple Glassmorphism Styling */
        .glass-panel {
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 24px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
        }

        /* Header & Search Bar */
        header {
            width: 100%;
            max-width: 1200px;
            text-align: center;
            margin-bottom: 3rem;
        }

        h1 {
            font-size: 3rem;
            font-weight: 700;
            margin-bottom: 1.5rem;
            letter-spacing: -0.5px;
            background: linear-gradient(180deg, #ffffff 0%, #a5b4fc 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .search-container {
            max-width: 500px;
            margin: 0 auto;
            position: relative;
        }

        .search-bar {
            width: 100%;
            padding: 14px 24px;
            font-size: 1rem;
            color: #fff;
            outline: none;
            transition: all 0.3s ease;
        }

        .search-bar::placeholder {
            color: rgba(255, 255, 255, 0.5);
        }

        .search-bar:focus {
            background: rgba(255, 255, 255, 0.15);
            box-shadow: 0 0 15px rgba(165, 180, 252, 0.3);
        }

        /* Games Grid */
        .games-grid {
            width: 100%;
            max-width: 1200px;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 2rem;
            padding: 10px;
        }

        /* Game Card */
        .game-card {
            cursor: pointer;
            overflow: hidden;
            transition: transform 0.3s cubic-bezier(0.25, 1, 0.5, 1), box-shadow 0.3s ease;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 1.5rem;
            text-align: center;
        }

        .game-card:hover {
            transform: translateY(-8px);
            background: rgba(255, 255, 255, 0.12);
            border-color: rgba(255, 255, 255, 0.3);
            box-shadow: 0 12px 40px 0 rgba(165, 180, 252, 0.25);
        }

        .game-thumbnail {
            width: 120px;
            height: 120px;
            object-fit: contain;
            border-radius: 18px;
            margin-bottom: 1.2rem;
            background: rgba(0, 0, 0, 0.2);
            padding: 10px;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.5);
        }

        .game-title {
            font-size: 1.2rem;
            font-weight: 600;
            color: rgba(255, 255, 255, 0.9);
        }

        /* No Results Message */
        .no-results {
            display: none;
            font-size: 1.2rem;
            color: rgba(255, 255, 255, 0.5);
            margin-top: 3rem;
        }

        /* Modal Overlay */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        /* Main Game Containment Box */
        .modal-content {
            width: 100%;
            max-width: 1000px;
            height: 85vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7);
        }

        /* Control Bar (Glassmorphic) */
        .control-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 24px;
            background: rgba(255, 255, 255, 0.05);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .control-btn {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: #fff;
            padding: 8px 16px;
            border-radius: 12px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.9rem;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: all 0.2s ease;
        }

        .control-btn:hover {
            background: rgba(255, 255, 255, 0.2);
            border-color: rgba(255, 255, 255, 0.3);
            box-shadow: 0 4px 12px rgba(165, 180, 252, 0.2);
        }

        .control-btn.close-style {
            background: rgba(239, 68, 68, 0.2);
            border-color: rgba(239, 68, 68, 0.3);
        }

        .control-btn.close-style:hover {
            background: rgba(239, 68, 68, 0.4);
            border-color: rgba(239, 68, 68, 0.5);
        }

        /* Wrapper to keep iframe scaling nicely */
        .iframe-container {
            flex-grow: 1;
            width: 100%;
            height: 100%;
            background: #000;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>
<body>

    <header>
        <h1>Unbloxed Games</h1>
        <div class="search-container">
            <input type="text" id="searchBar" class="search-bar glass-panel" placeholder="Search games..." onkeyup="searchGames()">
        </div>
    </header>

    <main class="games-grid" id="gamesGrid">
        
        <div class="game-card glass-panel" data-title="slope 3d" onclick="openGame('https://azgames.io/game/slope/')">
            <img src="https://slopeonline.online/upload/imgs/options/slope-game-logo.png" alt="Slope 3D" class="game-thumbnail">
            <div class="game-title">Slope 3D</div>
        </div>

        <div class="game-card glass-panel" data-title="placeholder game 1" style="opacity: 0.4;">
            <div class="game-thumbnail" style="display: flex; align-items: center; justify-content: center; font-size: 2rem;">🎮</div>
            <div class="game-title">Coming Soon</div>
        </div>

        <div class="game-card glass-panel" data-title="placeholder game 2" style="opacity: 0.4;">
            <div class="game-thumbnail" style="display: flex; align-items: center; justify-content: center; font-size: 2rem;">🕹️</div>
            <div class="game-title">Coming Soon</div>
        </div>

    </main>

    <div id="noResults" class="no-results">No games found matching your search.</div>

    <div class="modal" id="gameModal">
        <div class="modal-content glass-panel">
            
            <div class="control-bar">
                <button class="control-btn close-style" onclick="closeGame()">
                    ← Back to Menu
                </button>
                <button class="control-btn" onclick="toggleFullScreen()">
                    ⛶ Full Screen
                </button>
            </div>

            <div class="iframe-container" id="iframeContainer">
                <iframe id="gameFrame" src="" allowfullscreen></iframe>
            </div>

        </div>
    </div>

    <script>
        // Open game modal
        function openGame(url) {
            const modal = document.getElementById('gameModal');
            const frame = document.getElementById('gameFrame');
            frame.src = url;
            modal.style.display = 'flex';
        }

        // Close game window (Back to Home Menu)
        function closeGame() {
            const modal = document.getElementById('gameModal');
            const frame = document.getElementById('gameFrame');
            
            // Exit fullscreen if active when leaving game
            if (document.fullscreenElement) {
                document.exitFullscreen();
            }

            frame.src = ''; // Kill frame processes / sound
            modal.style.display = 'none';
        }

        // Native Browser Fullscreen Controller
        function toggleFullScreen() {
            const container = document.getElementById('iframeContainer');
            
            if (!document.fullscreenElement) {
                // Request modern standard fullscreen on the canvas/iframe wrapper
                if (container.requestFullscreen) {
                    container.requestFullscreen();
                } else if (container.webkitRequestFullscreen) { /* Safari */
                    container.webkitRequestFullscreen();
                } else if (container.msRequestFullscreen) { /* IE11 */
                    container.msRequestFullscreen();
                }
            } else {
                // Drop out of full screen mode
                if (document.exitFullscreen) {
                    document.exitFullscreen();
                }
            }
        }

        // Real-time search filter function
        function searchGames() {
            const input = document.getElementById('searchBar').value.toLowerCase();
            const cards = document.getElementsByClassName('game-card');
            const noResults = document.getElementById('noResults');
            let visibleCardsCount = 0;

            for (let i = 0; i < cards.length; i++) {
                const title = cards[i].getAttribute('data-title');
                if (title.includes(input)) {
                    cards[i].style.display = 'flex';
                    visibleCardsCount++;
                } else {
                    cards[i].style.display = 'none';
                }
            }

            if (visibleCardsCount === 0) {
                noResults.style.display = 'block';
            } else {
                noResults.style.display = 'none';
            }
        }
    </script>
</body>
</html>
